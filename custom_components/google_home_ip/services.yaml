play_audio:
  target:
    entity:
      integration: google_home_ip
      domain: media_player
  fields:
    media:
      required: true
      example: "/config/www/sonidos/timbre.mp3"
      selector:
        text:
    volume:
      required: false
      example: 0.5
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
          mode: slider
    restore_volume:
      required: false
      default: false
      selector:
        boolean:
    announce:
      required: false
      default: false
      selector:
        boolean:
